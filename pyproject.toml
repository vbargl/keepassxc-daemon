[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "keepassxc-daemon"
version = "0.2.0"
description = "Read-only local KeePassXC CLI daemon with automatic database reload"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/vbargl/keepassxc-daemon"

[project.scripts]
keepassxc-daemon = "keepassxc_daemon:cli"

[tool.setuptools]
py-modules = ["keepassxc_daemon"]
